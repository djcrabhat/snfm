# Configuration file for snfm
#
# Rename this file to "snfm_config.yaml" and put in one of these directories
# (shown here in search order):
# 
# WINDOWS:
# 1. The same directory that send_file.exe is in
# 2. %LOCALAPPDATA%/snfm
#
# UNIX:
# 1. The same directory that send_file is in
# 2. Any of $XDG_CONFIG_DIRS/snfm
# 3. $HOME/.config/snfm (if $XDG_CONFIG_DIRS unset)
# 

### default directory to put the ROM if no rules are matched.
### Default is .sni - directories that start with "." are hidden in the FXPAKPRO UI
# default_rom_directory: ".sni"

### (optional) a command to run once the ROM has been sent to the device and booted.
### Handy for things like writing the MSU pack you picked out to a file for a stream overlay.
### It's a list: the program to run, then each of its arguments.  These variables are
### substituted into each item before the command is run:
###   {rule_name}            - the rule that matched, e.g. "alttpr" (empty if nothing matched)
###   {destination_name}     - the destination you picked, e.g. "WildArms2" (empty if nothing matched)
###   {destination_path}     - the directory on the device, e.g. "/ROMs/_alttpr/_msu1/wa2"
###   {destination_rom_name} - the ROM's name on the device, e.g. "alttp_msu.sfc"
###   {destination_file}     - the full path on the device, e.g. "/ROMs/_alttpr/_msu1/wa2/alttp_msu.sfc"
###   {source_path}          - the full path of the ROM on your computer
###   {source_name}          - the file name of the ROM on your computer
### The program is run directly, not through a shell, so each item arrives as exactly one
### argument, spaces, quotes and all - there's no escaping to worry about.  An unknown
### {variable} is an error.  Put quotes around any item that starts with "{", or YAML
### will read it as something else.
### Example - hand the destination to your own program:
# post_upload_command: ["C:/tools/obs-msu.exe", "--pack", "{destination_name}"]
### Want shell features like redirects?  Pass the values in as arguments instead of
### pasting them into the script, so they're never run as part of it.
### Windows - put this in msu.ps1:   Set-Content -Path "$env:USERPROFILE\msu.txt" -Value $args[0]
# post_upload_command: ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "C:/scripts/msu.ps1", "{destination_name}"]
### ...and the same thing on unix ("$1" is the first argument after "sh"):
# post_upload_command: ["sh", "-c", "printf '%s\n' \"$1\" > \"$HOME/msu.txt\"", "sh", "{destination_name}"]
### Batch files (.bat/.cmd) aren't allowed: Windows always runs them through cmd.exe,
### which would interpret whatever is in the values.

### a set of rules to use to put certain ROMs in certain locations, such as your randomizer ROMs, useful for MSU1 users
rom_destination_rules:
  # Unique name for your rule
  alttpr:
    # List of glob patterns to match your ROM name against
    name_patterns:
      - "ALttP - VT_*" # look for an input ROM that matches this name
      - "alttpr - *"
      - "alttprcustom - *"
      - "ER_*"
      - "DR_*"
      - "P1_*"
      - "*DR_*"
      - "BD_*"
      - "Daily Challenge_*"
    # If there are multiple destinations, a window will pop up asking you to pick
    destinations:
      - name: default
        path: "/ROMs/_alttpr"
      - name: WildArms2                 # The name shown in the popup UI
        path: "/ROMs/_alttpr/_msu1/wa2" # The directory where the ROM will go on device
        rom_name: alttp_msu.sfc         # (optional) name for the ROM to be renamed to
      - name: FinalFantasy7
        path: "/ROMs/_alttpr/_msu1/ff7"
        rom_name: alttp_msu.sfc
      - name: FinalFantasy7Remake
        path: "/ROMs/_alttpr/_msu1/ff7r"
        rom_name: alttp_msu.sfc
      - name: Naruto
        path: "/ROMs/_alttpr/_msu1/Naruto"
        rom_name: alttp_msu.sfc
      - name: Kirby and the Forgotten Land
        path: "/ROMs/_alttpr/_msu1/KirbyForgottenLand"
        rom_name: alttp_msu.sfc
  smz3:
    name_patterns:
      - "SMALttP - sm-*"
    # If there is a single destination, it's chosen automatically
    destinations:
      - name: default
        path: "/ROMs/_smz3"
  smw:
    name_patterns:
      - "smw-*"
    destinations:
      - name: default
        path: "/ROMs/SuperMarioWorld/Rando"
  supermetroiditem:
    name_patterns:
      - "Item Randomizer *"
      - "VARIA_Randomizer_*"
    destinations:
      - name: default
        path: "/ROMs/SuperMetroid/Rando"